# Builds the fingerprint library on GitHub's servers and publishes the app.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Then: Actions tab -> "Build library and publish app" -> Run workflow.
 
name: Build library and publish app
 
on:
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Look on jw.org for new audio-described videos"
        type: boolean
        default: true
      language:
        description: "jw.org language code (E = English, S = Spanish, T = Portuguese…)"
        type: string
        default: "E"
      auto_minutes:
        description: "Videos up to this many minutes are recognised automatically"
        type: string
        default: "10"
  schedule:
    - cron: "0 6 * * 1" # every Monday, picks up newly released described videos
  push:
    branches: [main]
    paths: ["docs/**", "indexer/**", ".github/workflows/**"]
 
permissions:
  contents: write
 
concurrency:
  group: library
  cancel-in-progress: false
 
defaults:
  run:
    shell: bash
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JW_LANG: ${{ inputs.language || 'E' }}
      AUTO_MIN: ${{ inputs.auto_minutes || '10' }}
    steps:
      - uses: actions/checkout@v4
 
      - name: Show which files this run is using
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $(git log -1 --format='%h %s (%cr)')"
          echo
          echo "All copies of build_index.py in the repository:"
          find . -name build_index.py -not -path './.git/*' | while read -r f; do
            if grep -q "auto-max-minutes" "$f"; then echo "  $f  -> NEW version"; else echo "  $f  -> OLD version"; fi
          done
          echo
          echo "Top-level files and folders:"
          ls -la
          if ! grep -q "auto-max-minutes" indexer/build_index.py 2>/dev/null; then
            echo "::error::indexer/build_index.py on branch $GITHUB_REF_NAME is still the OLD version. See the list above for where the new one went."
            exit 1
          fi
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
 
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          pip install -r indexer/requirements.txt
 
      # Fingerprints are cached between runs (even failed ones),
      # so only new videos are downloaded next time.
      - name: Restore fingerprint cache
        uses: actions/cache/restore@v4
        with:
          path: indexer/.cache
          key: fp-${{ env.JW_LANG }}-${{ github.run_id }}
          restore-keys: fp-${{ env.JW_LANG }}-
 
      - name: Find audio-described videos and their originals
        if: github.event_name == 'schedule' || inputs.rediscover || hashFiles('manifest.json') == ''
        run: python indexer/discover.py --lang "$JW_LANG" --merge manifest.json --out manifest.json
 
      - name: Build fingerprint library
        run: python indexer/build_index.py manifest.json --out docs/data --auto-max-minutes "$AUTO_MIN" 2>&1 | tee build.log
 
      - name: Save fingerprint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: indexer/.cache
          key: fp-${{ env.JW_LANG }}-${{ github.run_id }}
 
      # Keeps the logs and manifest even when the run fails, for diagnosis.
      - name: Save logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-build-log-${{ github.run_id }}
          path: |
            build.log
            manifest.json
          if-no-files-found: ignore
 
      - name: Report
        if: always()
        run: |
          {
            echo "## Video library"
            grep '^wrote ' build.log 2>/dev/null | sed 's/^/- /' || true
            if [ -f manifest.json ]; then
              python -c "import json; m=json.load(open('manifest.json')); print(f\"- {len(m.get('unpaired', []))} described videos could not be paired automatically (see manifest.json)\")"
            fi
            if grep -q '!!' build.log 2>/dev/null; then
              echo; echo "### Problems"; echo '```'
              grep -B1 '!!' build.log | grep -v '^--$' | head -100
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
 
      - name: Check the site fits on GitHub Pages
        run: |
          size=$(du -sb docs | cut -f1)
          echo "Site size: $((size/1000000)) MB"
          if [ "$size" -gt 950000000 ]; then
            echo "::error::The site is $((size/1000000)) MB; GitHub Pages allows 1 GB."
            exit 1
          fi
 
      # Only the small manifest is stored in the repository; the fingerprint
      # files go straight to the published site.
      - name: Save manifest to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
          else
            git commit -m "Update video list ($JW_LANG)"
            git pull --rebase --autostash
            git push
          fi
 
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
